controller_manager:
  ros__parameters:
    thread_priority: 98
    update_rate: 1000  # Hz
  
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    right_gravity_compensation:
      type: gravity_compensation/GravityCompensation

    left_gravity_compensation:
      type: gravity_compensation/GravityCompensation

    left_cartesian_impedance_controller:
      type: cartesian_impedance_controller/CartesianImpedanceController
    
    right_cartesian_impedance_controller:
      type: cartesian_impedance_controller/CartesianImpedanceController
    
    left_motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle

    right_motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle


/**/right_gravity_compensation:
  ros__parameters:
    end_effector_link: "franka1_fr3_link0"
    ft_sensor_ref_link: "franka1_tcp" 
    robot_base_link: "world"
    compensate_gravity: false 
    compensate_coriolis: false 
    command_current_configuration: false
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    joints:
      - franka1_fr3_joint1
      - franka1_fr3_joint2
      - franka1_fr3_joint3
      - franka1_fr3_joint4
      - franka1_fr3_joint5
      - franka1_fr3_joint6
      - franka1_fr3_joint7

/**/left_gravity_compensation:
  ros__parameters:
    end_effector_link: "franka2_fr3_link0"
    ft_sensor_ref_link: "franka2_tcp" 
    robot_base_link: "world"
    compensate_gravity: false 
    compensate_coriolis: false 
    command_current_configuration: false
    command_interfaces:
